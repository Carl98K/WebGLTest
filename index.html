const canvas = document.querySelector("#unity-canvas");

};

// Start the loading process and store the promise
const unityInstancePromise = createUnityInstance(canvas, config, (progress) => {
  // Optional: Update a hidden loading bar here
  console.log(`Loading: ${Math.round(100 * progress)}%`);
});

startButton.onclick = async () => {
  // 2. UI Transition (Immediate feedback)
  startButton.textContent = "Loading Game...";
  startButton.disabled = true;

  try {
    // 3. Await the pre-existing promise
    const unityInstance = await unityInstancePromise;

    // 4. Reveal Unity
    startScreen.style.display = "none";
    unityContainer.style.display = "block";

    // 5. Handle Success
    MyGameInstance = unityInstance;
    console.log("Unity Ready!");
    sendTokenToUnity();

  } catch (error) {
    alert("Unity Loading Failed: " + error);
    startButton.disabled = false;
    startButton.textContent = "Start Game";
  }
};

        if (MyGameInstance) {
          MyGameInstance.SendMessage("Sound Handler", "ReceiveValue", state);
        }

        if (msg.action === 'pause') {
          // Pause game/audio
          console.log('Pausing due to', msg.reason);
        }
      };
    }

  <!--Script for the loading bar-->
  <script>
    window.addEventListener('load', function () {
      const startButton = document.getElementById('start-button');
      const loadingBarFill = document.getElementById('loading-bar-fill');
      const loadingBarContainer = document.getElementById('loading-bar-container');
      const loadingText = document.getElementById('loading-text');
      const versionText = document.getElementById('version-text');

      if (!startButton || !loadingBarFill || !loadingBarContainer) return;

      //5s loading-bar then button show
      loadingBarFill.addEventListener('animationend', function () {
        loadingBarContainer.style.display = 'none';
        startButton.style.display = 'inline-block';
        loadingText.textContent = "";
        versionText.textContent = "";
      });
    });
  </script>
