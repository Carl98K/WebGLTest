<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | Unleash Play</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body style="text-align: center; padding: 0; border: 0; margin: 0;">

  <div id="start-screen">
    <div id="background-icons">
      <img id="dog-icon" src="TemplateData/Dog loading.gif" alt="dog icon">
      <p id="loading-text"></p>
    </div>
  </div>


  <div id="unity-container" style="display: none;">
    <canvas id="unity-canvas" width=540 height=960 tabindex="-1"
      style="width: 540px; height: 960px; background: #231F20"></canvas>
  </div>

  <!-- Vanilla code for unity canvas game -->
  <!--<canvas id="unity-canvas" width=540 height=960 tabindex="-1"
    style="width: 540px; height: 960px; background: #231F20"></canvas>-->

  <script src="Build/Web GL Testing.loader.js"></script>

  <script>
(() => {
    // 1. Cache DOM Elements
    const head = document.head;
    const body = document.body;
    const unityCanvas = document.querySelector("#unity-canvas");
    const unityContainer = document.querySelector("#unity-container");
    const startScreen = document.querySelector("#start-screen");

    let myGameInstance = null;

    // 2. Optimized Mobile Handling
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        const meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        head.appendChild(meta);

        Object.assign(unityCanvas.style, {
            width: "100%",
            height: "100%",
            position: "fixed"
        });
        body.style.textAlign = "left";
    }

    // 3. Extract URL Data early
    const urlParams = new URLSearchParams(window.location.search);
    const userToken = urlParams.get("token");

    // 4. Unity Configuration
    const config = {
        dataUrl: "Build/Web GL Testing.data",
        frameworkUrl: "Build/Web GL Testing.framework.js",
        codeUrl: "Build/Web GL Testing.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "HSI",
        productName: "Unleash Play",
        productVersion: "1.2.2 (191)",
    };

    // 5. Setup Communication Bridges immediately
    window.onFlutterMessage = (msg) => {
        console.log('Flutter Message:', msg);
        if (myGameInstance) {
            myGameInstance.SendMessage("Sound Handler", "ReceiveValue", JSON.stringify(msg));
        }
        if (msg.action === 'pause') {
            console.log('Pausing:', msg.reason);
        }
    };

    const sendTokenToUnity = () => {
        if (userToken && myGameInstance) {
            myGameInstance.SendMessage("API Manager", "ReceiveToken", userToken);
        }
    };

    // 6. Initialize Unity
    createUnityInstance(unityCanvas, config, (progress) => {
        // Optional: Update a progress bar here
    }).then((unityInstance) => {
        myGameInstance = unityInstance;

        // Visual Transition: Handle Fade-out properly
        startScreen.classList.add("fade-out");
        
        // Wait for CSS transition (usually 500ms) before hiding and showing game
        setTimeout(() => {
            startScreen.style.display = "none";
            unityContainer.style.display = "block";
            sendTokenToUnity();
        }, 500); 

    }).catch((err) => {
        console.error("Unity Initialization Error:", err);
    });
})();
</script>
</body>

</html>
