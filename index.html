<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | Unleash Play</title>

  <style>
    html,
    body {
      overflow: hidden;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
    }

    #start-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 540px;
      height: 960px;
      background-color: #081c8d;
      color: white;
    }
  </style>
</head>

<body style="text-align: center; padding: 0; border: 0; margin: 0;">
  <div id="start-screen">
    <h1>Unleash Game</h1>
    <button id="start-button">PLAY GAME</button>
  </div>

  <div id="unity-container" style="display: none;">
    <canvas id="unity-canvas" width=540 height=960 tabindex="-1"
      style="width: 540px; height: 960px; background: #231F20"></canvas>
  </div>

  <!--<canvas id="unity-canvas" width=540 height=960 tabindex="-1"
    style="width: 540px; height: 960px; background: #231F20"></canvas>-->
  <script src="Build/Web GL Build and Run.loader.js"></script>
  <script>
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      // Mobile device style: fill the whole browser client area with the game canvas:
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);

      var canvas = document.querySelector("#unity-canvas");
      canvas.style.width = "100%";
      canvas.style.height = "100%";
      canvas.style.position = "fixed";

      document.body.style.textAlign = "left";
    }

    const startScreen = document.querySelector("#start-screen");
    const startButton = document.querySelector("#start-button");
    const unityContainer = document.querySelector("#unity-container");

    let MyGameInstance = "";

    startButton.onclick = () => {
  // Hide the button so it can't be clicked twice
  startScreen.style.display = "none";
  unityContainer.style.display = "block";

  createUnityInstance(document.querySelector("#unity-canvas"), {
    dataUrl: "Build/Web GL Build and Run.data",
    frameworkUrl: "Build/Web GL Build and Run.framework.js",
    codeUrl: "Build/Web GL Build and Run.wasm",
    symbolsUrl: "Build/Web GL Build and Run.symbols.json",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "HSI",
    productName: "Unleash Play",
    productVersion: "1.2.1 (83)",
    // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
  }).then((unityInstance) => {
    // Store the instance globally so you can call unityInstance.SendMessage() from JS
      MyGameInstance = unityInstance;

      console.log("Hello Instance !");
  }).catch((message) => {
    alert(message);
  });

  if (MyGameInstance != null) {
      const urlParams = new URLSearchParams(window.location.search);
      const myVar = urlParams.get("token");
      console.log(myVar);

      setTimeout(function () {
        MyGameInstance.SendMessage("API Manager", "ReceiveToken", myVar);
      }, 5000);
    }
    else {
      console.log("MyGameInstance is null!");
    };
};
