<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unleash Play</title>
  
  <link rel="preload" href="Build/Web GL Testing.loader.js" as="script">
  <link rel="preload" href="Build/Web GL Testing.framework.js" as="script">
  <link rel="preload" href="Build/Web GL Testing.data" as="fetch" crossorigin>
  
  <link rel="shortcut icon" href="TemplateData/favicon.ico">

  <style>
    /* 2. MINIMAL CSS: Just the dog and a background */
    body { background: #232323; margin: 0; overflow: hidden; }
    
    #start-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #232323; z-index: 99;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.6s ease-out; /* Smooth fade when done */
    }

    #unity-canvas { width: 100%; height: 100%; background: #232323; }
    
    .hidden { opacity: 0; pointer-events: none; }
  </style>
</head>

<body>
  <div id="start-screen">
    <img src="TemplateData/Dog loading.gif" alt="Loading..." width="120">
  </div>

  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <script src="Build/Web GL Testing.loader.js"></script>

  <script>
    const startScreen = document.querySelector("#start-screen");
    const canvas = document.querySelector("#unity-canvas");

    const urlParams = new URLSearchParams(window.location.search);
    const userToken = urlParams.get("token");

    // Mobile Handling
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      canvas.style.position = "fixed";
    }

    const config = {
      dataUrl: "Build/Web GL Testing.data",
      frameworkUrl: "Build/Web GL Testing.framework.js",
      codeUrl: "Build/Web GL Testing.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "HSI",
      productName: "Unleash Play",
      productVersion: "1.2.2 (190)",
    };

    let myGameInstance = null;

    // Load Unity Instance
    createUnityInstance(canvas, config, (progress) => {
      // Logic for bar removed. Just waiting for completion.
    }).then((unityInstance) => {
      myGameInstance = unityInstance;
      
      // Hide loading screen and start game
      startScreen.classList.add("hidden");
      
      // Wait for fade animation to finish before removing from DOM
      setTimeout(() => { 
        startScreen.style.display = "none"; 
        sendTokenToUnity();
      }, 600);

    }).catch((err) => alert(err));

    function sendTokenToUnity() {
      if (userToken && myGameInstance) {
        myGameInstance.SendMessage("API Manager", "ReceiveToken", userToken);
      }
    }

    // Flutter listener
    window.onFlutterMessage = function (msg) {
      if (myGameInstance) {
        myGameInstance.SendMessage("Sound Handler", "ReceiveValue", JSON.stringify(msg));
      }
    };
  </script>
</body>
</html>
