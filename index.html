<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | Unleash Play</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body style="text-align: center; padding: 0; border: 0; margin: 0;">

  <div id="start-screen">
    <div id="background-icons">
      <img id="dog-icon" src="TemplateData/Dog loading.gif" alt="dog icon">
      <p id="loading-text">Loading pets: 0%</p>
    </div>
  </div>

  <div id="unity-container" style="display: none;">
    <canvas id="unity-canvas" width=540 height=960 tabindex="-1"
      style="width: 540px; height: 960px; background: #231F20"></canvas>
  </div>

  <script src="Build/Web GL Testing Github.loader.js"></script>

  <script>

    // Mobile viewport handling
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);

      var canvas = document.querySelector("#unity-canvas");
      canvas.style.width = "100%";
      canvas.style.height = "100%";
      canvas.style.position = "fixed";
      document.body.style.textAlign = "left";
    }

    // DOM Elements
    const startScreen = document.querySelector("#start-screen");
    const unityContainer = document.querySelector("#unity-container");
    const unityCanvas = document.querySelector("#unity-canvas");
    const loadingText = document.querySelector("#loading-text");

    let myGameInstance = null;

    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const userToken = urlParams.get("token");

    // Unity Configuration
    const config = {
      dataUrl: "Build/Web GL Testing Github.data",
      frameworkUrl: "Build/Web GL Testing Github.framework.js",
      codeUrl: "Build/Web GL Testing Github.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "HSI",
      productName: "Unleash Play",
      productVersion: "1.3.1 (227)",
    };

    // Send app state (Flutter <-> Unity communication)
    function sendAppStateToUnity() {
      window.onFlutterMessage = function (msg) {
        console.log('Received message from Flutter:', msg);

        if (myGameInstance) {
          const state = JSON.stringify(msg);
          myGameInstance.SendMessage("Sound Handler", "ReceiveValue", state);
        }
      };
    }

    // Send user token to Unity
    function sendTokenToUnity() {
      if (userToken && myGameInstance) {
        console.log("Sending token:", userToken);
        myGameInstance.SendMessage("API Manager", "ReceiveToken", userToken);
      }
    }

    // Initialize Unity with loading progress
    createUnityInstance(unityCanvas, config, (progress) => {
      // Update loading percentage
      const percentage = Math.round(progress * 100);
      loadingText.textContent = `Loading pets: ${percentage}%`;
    })
    .then((unityInstance) => {
      // Game successfully loaded
      myGameInstance = unityInstance;

      console.log("Unity WebGL instance created successfully");

      // Instantly hide loading screen and show game (no fade)
      startScreen.style.display = "none";
      unityContainer.style.display = "block";

      // Send token after game is visible
      sendTokenToUnity();
    })
    .catch((message) => {
      console.error("Unity Loading Failed:", message);
      loadingText.textContent = "Failed to load the game. Please refresh.";
      loadingText.style.color = "#ff4444";
    });

    // Initialize Flutter communication
    sendAppStateToUnity();

  </script>
</body>

</html>
